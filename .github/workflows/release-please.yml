on:
  push:
    branches:
      - main
      - 'release-*'  # Support backport release branches (e.g., release-1.22.x)

permissions:
  contents: write
  pull-requests: write

name: release-please

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # The shared MY_RELEASE_PLEASE_TOKEN PAT expired in 2026-06; use the
      # org CI GitHub App, as main does. Inline rather than the reusable
      # workflow, which does not pass target-branch.
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ vars.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
      - uses: googleapis/release-please-action@v4.4.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: ${{ github.ref_name }}
